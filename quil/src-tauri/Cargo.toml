[package]
name = "quil"
version = "0.1.0"
description = "Quil — Private Local AI Companion"
authors = ["bryanthunsberger"]
license = "MIT"
repository = "https://github.com/Obsycra/obsycra-labs/quil"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
